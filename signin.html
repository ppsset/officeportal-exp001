<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - WAG Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .signin-bg { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .form-card { transition: all 0.3s ease; }
        .form-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #1e40af); }
        .floating-label { position: relative; }
        .floating-label input:focus + label,
        .floating-label input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.875);
            color: #3b82f6;
        }
        .floating-label label {
            position: absolute;
            left: 0.75rem;
            top: 0.75rem;
            transition: all 0.2s ease;
            pointer-events: none;
            color: #9ca3af;
        }
    </style>
</head>
<body class="signin-bg min-h-screen flex items-center justify-center p-4">
    
    <!-- Sign In Container -->
    <div class="w-full max-w-md">
        <!-- Logo and Brand -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-gray-700 to-gray-900 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-building text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">WAG Portal</h1>
            <p class="text-gray-600 text-sm">MEP Design Office Management</p>
        </div>

        <!-- Sign In Form Card -->
        <div class="form-card bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Welcome Back</h2>
                <p class="text-gray-600 text-sm">Sign in to access your account</p>
            </div>

            <form id="signinForm" class="space-y-6">
                <!-- Email Input -->
                <div class="floating-label">
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder=" "
                        class="w-full px-3 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:border-blue-500 transition-colors"
                        required
                    >
                    <label for="email">Email Address</label>
                </div>

                <!-- Password Input -->
                <div class="floating-label">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder=" "
                        class="w-full px-3 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:border-blue-500 transition-colors"
                        required
                    >
                    <label for="password">Password</label>
                </div>

                <!-- Role Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">Sign in as</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative">
                            <input type="radio" name="role" value="user" class="sr-only" checked>
                            <div class="role-option p-3 border border-gray-300 rounded-lg cursor-pointer transition-colors hover:border-blue-500">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-user text-gray-400"></i>
                                    <span class="text-sm font-medium text-gray-700">User</span>
                                </div>
                            </div>
                        </label>
                        <label class="relative">
                            <input type="radio" name="role" value="admin" class="sr-only">
                            <div class="role-option p-3 border border-gray-300 rounded-lg cursor-pointer transition-colors hover:border-blue-500">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-crown text-gray-400"></i>
                                    <span class="text-sm font-medium text-gray-700">Admin</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-700 transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- Sign In Button -->
                <button 
                    type="submit" 
                    class="w-full btn-primary text-white py-3 px-4 rounded-lg font-medium transition-all duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Sign In
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <div class="text-xs text-gray-500 text-center mb-2">Demo Credentials</div>
                <div class="grid grid-cols-1 gap-2 text-xs">
                    <div class="bg-gray-50 p-2 rounded">
                        <span class="font-medium text-gray-700">User:</span> user@example.com / password
                    </div>
                    <div class="bg-gray-50 p-2 rounded">
                        <span class="font-medium text-gray-700">Admin:</span> admin@example.com / password
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-500">
                © 2024 WAG Portal. All rights reserved.
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Animate form card on load
            anime({
                targets: '.form-card',
                translateY: [50, 0],
                opacity: [0, 1],
                duration: 800,
                easing: 'easeOutQuart',
                delay: 200
            });

            // Animate logo on load
            anime({
                targets: '.w-16',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 600,
                easing: 'easeOutBack',
                delay: 100
            });

            // Role selection functionality
            const roleOptions = document.querySelectorAll('.role-option');
            const roleInputs = document.querySelectorAll('input[name="role"]');

            roleInputs.forEach((input, index) => {
                input.addEventListener('change', () => {
                    roleOptions.forEach(option => {
                        option.classList.remove('border-blue-500', 'bg-blue-50');
                        option.classList.add('border-gray-300');
                    });
                    
                    if (input.checked) {
                        roleOptions[index].classList.remove('border-gray-300');
                        roleOptions[index].classList.add('border-blue-500', 'bg-blue-50');
                    }
                });
            });

            // Form submission
            const signinForm = document.getElementById('signinForm');
            signinForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.querySelector('input[name="role"]:checked').value;
                
                // Animate button
                const submitBtn = signinForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';
                submitBtn.disabled = true;
                
                // Simulate authentication
                setTimeout(() => {
                    // Show success notification
                    showNotification('Sign in successful! Redirecting...', 'success');
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (role === 'admin') {
                            window.location.href = 'index.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                }, 2000);
            });

            // Input focus animations
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    anime({
                        targets: input,
                        scale: [1, 1.02, 1],
                        duration: 200,
                        easing: 'easeInOutQuad'
                    });
                });
            });
        });

        function showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${getNotificationClass(type)}`;
            notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas ${getNotificationIcon(type)}"></i>
                    <span>${message}</span>
                    <button class="ml-4 text-gray-400 hover:text-gray-600" onclick="this.parentElement.parentElement.remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Animate notification appearance
            anime({
                targets: notification,
                translateX: [300, 0],
                opacity: [0, 1],
                duration: 400,
                easing: 'easeOutQuart'
            });
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                anime({
                    targets: notification,
                    translateX: [0, 300],
                    opacity: [1, 0],
                    duration: 300,
                    easing: 'easeInQuart',
                    complete: () => {
                        notification.remove();
                    }
                });
            }, 5000);
        }

        function getNotificationClass(type) {
            const classes = {
                success: 'bg-green-100 text-green-800 border border-green-200',
                error: 'bg-red-100 text-red-800 border border-red-200',
                warning: 'bg-yellow-100 text-yellow-800 border border-yellow-200',
                info: 'bg-blue-100 text-blue-800 border border-blue-200'
            };
            return classes[type] || classes.info;
        }

        function getNotificationIcon(type) {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            return icons[type] || icons.info;
        }
    </script>
</body>
</html>
